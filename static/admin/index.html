<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="cache-control" content="no-store" />
    <meta http-equiv="refresh" content="3;url=/workspace/site/" />
    <title>站点运营已迁移 · wouldkeep</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-serif, "Songti SC", "Noto Serif CJK SC", serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        background: #f6f2e9;
        color: #2e2b27;
      }
      main {
        width: min(34rem, calc(100% - 3rem));
      }
      a {
        color: inherit;
        font-weight: 700;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1e1d1a;
          color: #ede6d8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>站点运营已迁入个人工作区</h1>
      <p>正在清理旧后台的离线缓存，并前往新的站点运营页面。</p>
      <p><a href="/workspace/site/">立即前往站点运营</a></p>
      <noscript><p>请使用上方链接继续；新页面会重新确认你的账户权限。</p></noscript>
    </main>
    <script>
      ;(async () => {
        try {
          const cleanup = async () => {
            if (!("serviceWorker" in navigator)) return
            const registration = await navigator.serviceWorker.register("/admin/sw.js", {
              scope: "/admin/",
              updateViaCache: "none",
            })
            await registration.update()
          }
          await Promise.race([
            cleanup(),
            new Promise((resolve) => window.setTimeout(resolve, 1200)),
          ])
        } catch {
        } finally {
          location.replace("/workspace/site/")
        }
      })()
    </script>
  </body>
</html>
